<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Settings - CircuitRush Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Sora:wght@600;800&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#520072",
                        "on-tertiary-fixed-variant": "#095300",
                        "secondary-container": "#b600f8",
                        "on-tertiary": "#053900",
                        "on-background": "#e0e2ed",
                        "surface-container-low": "#181b23",
                        "surface-container": "#1d2027",
                        "surface-container-high": "#272a32",
                        "surface-dim": "#10131b",
                        "surface-tint": "#00dbe9",
                        "primary": "#dbfcff",
                        "primary-fixed": "#7df4ff",
                        "on-surface-variant": "#b9cacb",
                        "primary-container": "#00f0ff",
                        "surface-variant": "#32353d",
                        "on-secondary-fixed-variant": "#74009f",
                        "on-surface": "#e0e2ed",
                        "on-primary-fixed": "#002022",
                        "tertiary": "#e1ffd1",
                        "outline-variant": "#3b494b",
                        "secondary-fixed-dim": "#ebb2ff",
                        "tertiary-fixed-dim": "#2ae500",
                        "surface-container-highest": "#32353d",
                        "surface-container-lowest": "#0b0e15",
                        "on-primary-container": "#006970",
                        "on-error": "#690005",
                        "on-primary": "#00363a",
                        "inverse-surface": "#e0e2ed",
                        "inverse-on-surface": "#2d3038",
                        "background": "#10131b",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#320047",
                        "surface": "#10131b",
                        "tertiary-fixed": "#79ff5b",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#022100",
                        "secondary": "#ebb2ff",
                        "on-primary-fixed-variant": "#004f54",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-bright": "#363941",
                        "on-secondary-container": "#fff6fc",
                        "tertiary-container": "#33fb0a",
                        "inverse-primary": "#006970",
                        "outline": "#849495",
                        "secondary-fixed": "#f8d8ff",
                        "on-tertiary-container": "#106e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "margin-desktop": "40px",
                        "grid-cols": "12",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["Space Grotesk"],
                        "display-lg": ["Sora"],
                        "display-score": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Sora"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.2em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "display-score": ["40px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .glass-panel {
            background: linear-gradient(to bottom, rgba(18, 24, 38, 0.8), rgba(18, 24, 38, 0.4));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid theme('colors.primary-container');
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .cyber-button {
            border: 1px solid theme('colors.primary-container');
            background: transparent;
            color: theme('colors.primary-container');
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .cyber-button:hover, .cyber-button.active {
            background: theme('colors.primary-container');
            color: theme('colors.on-primary-fixed');
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: scale(1.02);
        }

        .cyber-button-secondary {
            border: 1px solid theme('colors.outline');
            color: theme('colors.on-surface');
            transition: all 0.2s ease-in-out;
        }

        .cyber-button-secondary:hover {
            border-color: theme('colors.on-surface');
            background: rgba(224, 226, 237, 0.1);
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: theme('colors.surface-variant');
            outline: none;
            border-radius: 0;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: theme('colors.primary-container');
            cursor: pointer;
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .range-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: theme('colors.primary-container');
            cursor: pointer;
            transform: rotate(45deg);
            border: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .key-hint {
            border: 1px solid theme('colors.outline-variant');
            background: rgba(59, 73, 75, 0.3);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        /* Decorative circuit lines */
        .circuit-line-h {
            height: 1px;
            background: theme('colors.primary-container');
            opacity: 0.4;
            width: 100%;
        }
        .circuit-node {
            width: 4px;
            height: 4px;
            background: theme('colors.primary-container');
            box-shadow: 0 0 5px theme('colors.primary-container');
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Dimmed Background Overlay to simulate gameplay behind -->
<div class="fixed inset-0 z-0 bg-surface-container-lowest/80 backdrop-blur-sm"></div>
<!-- Main Settings Panel -->
<main class="glass-panel relative z-10 w-full max-w-2xl flex flex-col p-8 md:p-12">
<!-- Corner Decorations -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary-container opacity-50"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary-container opacity-50"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary-container opacity-50"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary-container opacity-50"></div>
<!-- Header -->
<header class="flex items-center justify-between mb-10 pb-4 border-b border-primary-container/20 relative">
<div>
<h1 class="font-display-lg text-display-lg text-primary-container tracking-tighter italic mb-1 drop-shadow-[0_0_10px_rgba(0,240,255,0.3)]">CORE CONFIG</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant">SIGNAL_ID: 08x // SYSTEM PREFERENCES</p>
</div>
<span class="material-symbols-outlined text-primary-container text-4xl opacity-80" data-icon="settings" style="font-variation-settings: 'FILL' 0;">settings</span>
<!-- Circuit accent -->
<div class="absolute -bottom-[1px] right-0 w-1/3 flex items-center">
<div class="circuit-line-h"></div>
<div class="circuit-node"></div>
</div>
</header>
<!-- Settings Content -->
<div class="flex flex-col gap-8 flex-grow">
<!-- Difficulty Section -->
<section class="flex flex-col gap-3">
<h2 class="font-label-caps text-label-caps text-primary-fixed-dim">DIFFICULTY PROTOCOL</h2>
<div class="grid grid-cols-3 gap-2">
<button aria-pressed="false" class="cyber-button font-label-caps text-label-caps py-3 px-4 text-center focus:outline-none">EASY</button>
<button aria-pressed="true" class="cyber-button active font-label-caps text-label-caps py-3 px-4 text-center focus:outline-none">NORM</button>
<button aria-pressed="false" class="cyber-button font-label-caps text-label-caps py-3 px-4 text-center focus:outline-none border-error text-error hover:bg-error hover:text-on-error hover:shadow-[0_0_15px_rgba(255,180,171,0.4)]">OVERLOAD</button>
</div>
</section>
<!-- Speed Section -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<h2 class="font-label-caps text-label-caps text-primary-fixed-dim">BASE VELOCITY</h2>
<span class="font-display-score text-2xl text-primary-container" id="speed-value">07</span>
</div>
<div class="relative pt-2 pb-4">
<input class="range-slider" id="speed-slider" max="10" min="1" type="range" value="7"/>
<!-- Tick marks -->
<div class="flex justify-between px-1 mt-2">
<span class="font-label-caps text-[10px] text-on-surface-variant">MIN</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">MAX</span>
</div>
</div>
</section>
<!-- Input Help Section -->
<section class="flex flex-col gap-3 mt-2">
<h2 class="font-label-caps text-label-caps text-primary-fixed-dim">INPUT SCHEMATICS</h2>
<div class="bg-surface-container/50 border border-outline-variant/30 p-4 flex flex-col md:flex-row gap-6 items-center justify-center">
<!-- Arrow Keys -->
<div class="flex flex-col items-center gap-2">
<div class="flex justify-center w-full">
<div class="key-hint w-10 h-10 flex items-center justify-center font-label-caps text-label-caps text-on-surface">W</div>
</div>
<div class="flex gap-2">
<div class="key-hint w-10 h-10 flex items-center justify-center font-label-caps text-label-caps text-on-surface">A</div>
<div class="key-hint w-10 h-10 flex items-center justify-center font-label-caps text-label-caps text-on-surface">S</div>
<div class="key-hint w-10 h-10 flex items-center justify-center font-label-caps text-label-caps text-on-surface">D</div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant mt-1">NAVIGATE</span>
</div>
<!-- Separator -->
<div class="hidden md:block w-px h-16 bg-outline-variant/50"></div>
<!-- Mouse -->
<div class="flex flex-col items-center gap-2">
<div class="key-hint w-16 h-20 rounded-t-full rounded-b-xl flex flex-col items-center pt-2 relative">
<div class="w-full flex justify-center gap-1 px-2">
<div class="w-1/2 h-6 border border-primary-container bg-primary-container/20 shadow-[0_0_5px_rgba(0,240,255,0.3)]"></div>
<div class="w-1/2 h-6 border border-outline-variant"></div>
</div>
<span class="material-symbols-outlined absolute bottom-2 text-on-surface-variant" data-icon="mouse" style="font-variation-settings: 'FILL' 0;">mouse</span>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant mt-1">PRIMARY ACTION</span>
</div>
</div>
</section>
</div>
<!-- Actions Footer -->
<footer class="mt-12 pt-6 border-t border-outline-variant/30 flex flex-col md:flex-row gap-4 justify-between items-center relative">
<button class="cyber-button-secondary font-label-caps text-label-caps py-3 px-6 w-full md:w-auto order-2 md:order-1 focus:outline-none">
                RETURN TO GAMEPLAY
            </button>
<button class="cyber-button active font-label-caps text-label-caps py-3 px-8 w-full md:w-auto order-1 md:order-2 focus:outline-none flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="save" style="font-variation-settings: 'FILL' 1;">save</span>
                SAVE PREFERENCES
            </button>
<!-- Circuit accent -->
<div class="absolute top-0 left-0 w-1/4 h-[1px] bg-primary-container/40"></div>
</footer>
</main>
<script>
        // Simple interactions for the UI
        document.addEventListener('DOMContentLoaded', () => {
            // Difficulty Toggle
            const diffButtons = document.querySelectorAll('section:nth-of-type(1) .cyber-button');
            diffButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    diffButtons.forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    e.target.classList.add('active');
                    e.target.setAttribute('aria-pressed', 'true');
                    // Add a brief glow effect to panel on change
                    document.querySelector('main').style.boxShadow = '0 0 40px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1)';
                    setTimeout(() => {
                        document.querySelector('main').style.boxShadow = '';
                    }, 200);
                });
            });

            // Speed Slider
            const slider = document.getElementById('speed-slider');
            const speedValue = document.getElementById('speed-value');
            slider.addEventListener('input', (e) => {
                let val = e.target.value.padStart(2, '0');
                speedValue.textContent = val;
            });
        });
    </script>
</body></html>
